-bottom:9px}.field input,.field select{width:100%;padding:13px;border:1.5px solid #9caaa0;border-radius:8px;background:#fff;color:var(--ink)}.field.full{grid-column:1/-1}.uploadgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:22px}.upload{border:2px solid #9caa9f;border-radius:10px;padding:18px;min-height:138px}.uploadslots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.uploadslot{min-width:0;border:1.5px solid #a9b4ab;border-radius:9px;padding:14px;background:#fdfdfb}.slotlabel{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.slotnote{font-size:11px;color:var(--muted);margin-bottom:9px}.uploadslot input{width:100%;border:1.5px dashed #8f9e92;border-radius:7px;padding:10px;background:#fff}.uploadtop{display:flex;gap:12px;align-items:center;margin-bottom:12px}.ico{width:39px;height:39px;display:grid;place-items:center;border-radius:9px;background:#f4f0e7;color:#9e8556}.upload strong{font-size:13px}.upload small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.upload input{max-width:100%;font-size:12px}.fileinfo{font-size:12px;margin-top:11px;display:flex;justify-content:space-between;gap:8px;align-items:center;overflow-wrap:anywhere}.filelist{width:100%}.fileentry{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f2f0ea;overflow-wrap:anywhere}.fileentry button{margin-left:8px}.docview{max-width:140px;overflow-wrap:anywhere}.fileinfo a{color:#8e7546}.fileinfo button{background:none;border:0;color:#b44d4d}.formactions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.notice{background:#fbf7ed;border:1px solid #efe3c8;border-radius:8px;color:#846d43;padding:13px 15px;font-size:12px;margin:0 0 20px}.search{padding:10px 13px;border:1px solid var(--line);border-radius:8px;min-width:210px}.foot{margin-top:25px;font-size:11px;color:#9a9d97}.hidden{display:none!important}@media(max-width:750px){.shell{padding:18px 15px 55px .dashfilters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.dashfilters select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);min-width:145px}.dashfilters .search{max-width:230px}@media(max-width:700px){.panelhead{align-items:flex-start;flex-direction:column}.dashfilters{width:100%}.dashfilters .search{max-width:none;width:100%}} 
/* Dashboard: a single straight, aligned divider across the four document columns. */
#projectRows td.doccell:has(.doc-sections){padding:0;vertical-align:top}
#projectRows .doc-sections{border:0;border-radius:0;min-width:125px;display:grid;grid-template-rows:72px 72px;overflow:visible}
#projectRows .doc-section{padding:6px 10px;min-height:0;overflow-y:auto;overflow-x:hidden}
#projectRows .doc-section+.doc-section{border-top:1px solid #d9dfd9}
#projectRows td.doccell:has(.doc-sections)+td.doccell:has(.doc-sections){border-left:0}

#projectRows .doc-section-title{margin-bottom:3px}
#projectRows .doc-check{color:#26775b;font-weight:800;margin-left:3px}
#projectRows .doc-section .docview{display:inline-block;margin:4px 5px 0 0}

/* Clearly distinguish the boundary between projects from the light document divider. */
#projectRows tr td{border-bottom:2px solid #68776c}
#projectRows tr:last-child td{border-bottom:2px solid #68776c}
#projectRows .doc-section{overflow:visible}
#projectRows .doc-section+.doc-section{border-top:1px solid #dce2dc}
#projectRows .doc-sections{grid-template-rows:minmax(66px,auto) minmax(66px,auto)}
#projectRows .file-picker{position:relative;display:inline-block;margin-top:4px}
#projectRows .file-picker .docview{margin:0;display:inline-block}
#projectRows .file-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:30;min-width:112px;max-height:210px;overflow:auto;background:#fff;border:1px solid #aeb9af;border-radius:8px;box-shadow:0 8px 22px #1f2a2029;padding:4px}
#projectRows .file-menu[hidden]{display:none}
#projectRows .file-menu button{display:block;width:100%;border:0;border-radius:5px;background:#fff;text-align:left;padding:8px 10px;font-size:12px;color:#28342c;cursor:pointer;white-space:nowrap}
#projectRows .file-menu button:hover,#projectRows .file-menu button:focus{background:#f0f2ed}
/* Center the content vertically in each document half without creating excess whitespace. */
#projectRows .doc-sections{grid-template-rows:84px 84px}
#projectRows .doc-section{display:flex;flex-direction:column;justify-content:center;padding:8px 10px;min-height:0}
#projectRows .doc-section-title{margin-bottom:3px}
#projectRows .doc-section .file-picker{margin-top:4px}

/* Center PO status and its View control within the full document row. */
#projectRows td.doccell:not(:has(.doc-sections)){vertical-align:middle;text-align:center;}
#projectRows td.doccell:not(:has(.doc-sections)) .pill{margin-inline:auto;}
#projectRows td.doccell:not(:has(.doc-sections)) .file-picker{display:table;margin:7px auto 0;}

.travel-dates{white-space:nowrap;line-height:1.6}.travel-return{color:var(--muted);margin-top:3px}

<section id="register"><div class="formwrap"><div class="heading"><div><span id="formTitle" class="hidden" aria-hidden="true"></span></div></div><form id="projectForm"><div class="panel" style="padding:25px"><div class="formgrid"><div class="field full"><label for="project">Project *</label><input id="project" placeholder="Enter project name" required maxlength="200"></div><div class="field full"><label for="company">Company *</label><select id="company" required><option value="">Select Company</option><option value="Gagan (Thailand) Co., Ltd.">Gagan (Thailand) Co., Ltd.</option><option value="Prasan (Thailand) Co.,Ltd">Prasan (Thailand) Co.,Ltd</option><option value="Aryan (Thailand) Co., Ltd">Aryan (Thailand) Co., Ltd</option><option value="DFC Furnishing (Thailand)">DFC Furnishing (Thailand)</option></select></div><div class="field"><label for="departure">Departure Date *</label><input id="departure" type="date" required></div><div class="field"><label for="returnDate">Return Date *</label><input id="returnDate" type="date" required></div></div><div style="border-top:1px solid var(--line);margin:27px 0 21px"></div><div class="eyebrow">Documents</div><div class="uploadgrid" id="uploads"></div><div class="formactions"><button type="submit" class="btn primary" id="save">Save Project</button></div></div></form></div></section></div>
<script>
const DOCS=[{key:'air',name:'Air-Ticket',hint:'Upload E-Ticket',icon:'plane'},{key:'hotel',name:'Hotel',hint:'Upload Voucher',icon:'hotel'},{key:'transport',name:'Transportation',hint:'Upload Invoice',icon:'car'},{key:'insurance',name:'Travel Insurance',hint:'Upload Policy',icon:'shield'},{key:'po',name:'PO',hint:'Upload Document',icon:'file'}];
const SECTIONS=[{key:'email',name:'Email Request'},{key:'reference',name:'Reference'}];
const subKey=(doc,section)=>section==='main'?doc:doc+'_'+section;
const allKeys=()=>DOCS.flatMap(d=>d.key==='po'?[d.key]:SECTIONS.map(s=>subKey(d.key,s.key)));
const legacyKeys=['air','hotel','transport','insurance'];
const SVG={mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 8 10-8"/>',plane:'<path d="M17 21v-8l-7-4V3a2 2 0 0 0-4 0v6l-7 4v8l7-2v4l2 2 2-2v-4z"/>',hotel:'<rect x="4" y="3" width="16" height="20" rx="1"/><path d="M9 23v-5h6v5M8 8h2m4 0h2M8 13h2m4 0h2"/>',car:'<path d="M5 17h14l-1.5-7h-11L5 17zM5 17v3m14-3v3M3 13l2-3m14 0 2 3M8 14h.01M16 14h.01"/>',shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>'};
const icon=k=>`<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SVG[k]}</svg>`;
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalizeFiles=p=>{p.files=p.files||{};for(const key of [...allKeys(),'email','reference']){const v=p.files[key];if(v&&!Array.isArray(v))p.files[key]=[v];}if(p.files.email?.length&&!p.files.air_email?.length)p.files.air_email=p.files.email.map((f,i)=>({...f,legacyKey:'email',legacyIndex:i}));if(p.files.reference?.length&&!p.files.air_reference?.length)p.files.air_reference=p.files.reference.map((f,i)=>({...f,legacyKey:'reference',legacyIndex:i}));return p};
// Configure the API URL after the Worker is secured and deployed.
const API_BASE='https://al-futtaim-documents-api.itcbangkok1969.workers.dev';
let projects=[],editing=null;
// Public mode: no email sign-in or browser authentication tokens.
async function api(path,options={}){
 const r=await fetch(API_BASE+path,{...options,headers:{...(options.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(options.headers||{})}});
 const ct=r.headers.get('content-type')||'';
 const data=ct.includes('application/json')?await r.json():{error:'Unexpected server response ('+r.status+')'};
 if(!r.ok)throw Error(data.error||'API request failed ('+r.status+')');
 return data;
}

async function refreshProjects(){
 const data=await api('/projects');const byId=new Map();
 for(const row of data.projects||[])byId.set(row.id,{id:row.id,project:row.project,company:row.company,departure:row.departure,returnDate:row.return_date,files:{}});
 for(const f of data.files||[]){const p=byId.get(f.project_id);if(!p)continue;(p.files[f.document_key]??=[]).push({id:f.id,name:f.file_name,size:f.file_size,type:f.mime_type});}
 projects=[...byId.values()];render();
}
function complete(p){return !!(p.project&&p.departure&&p.returnDate&&DOCS.every(d=>d.key==='po'?!!p.files?.po?.length:SECTIONS.every(section=>!!p.files?.[subKey(d.key,section.key)]?.length)))}
function show(view){$('dashboard').classList.toggle('hidden',view!=='dashboard');$('register').classList.toggle('hidden',view!=='register');$('navDash').classList.toggle('active',view==='dashboard');$('navRegister').classList.toggle('active',view==='register');if(view==='dashboard')render();window.scrollTo(0,0)}
function filePicker(p,key){const fs=p.files?.[key]||[];if(!fs.length)return '';return `<div class="file-picker"><button type="button" class="docview" data-file-toggle aria-expanded="false" aria-label="Choose a file to view">View ▾</button><div class="file-menu" hidden>${fs.map((f,i)=>`<button type="button" data-view-project="${esc(p.id)}" data-view-doc="${esc(key)}" data-view-index="${i}" title="${esc(f.name||`File ${i+1}`)}">${esc(f.name||`File ${i+1}`)}</button>`).join('')}</div></div>`}
function fullTravelDate(value){if(!value)return '—';const match=String(value).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(!match)return esc(value);return esc(`${match[1]}-${Number(match[2])}-${Number(match[3])}`);}
function render(){
 const q=$('search').value.trim().toLowerCase(),month=$('monthFilter').value,po=$('poFilter').value,company=$('companyFilter').value;
 const monthValues=[...new Set(projects.map(p=>(p.departure||'').slice(0,7)).filter(Boolean))].sort().reverse();
 const monthSelect=$('monthFilter');
 monthSelect.innerHTML='<option value="">All Months</option>'+monthValues.map(v=>`<option value="${v}">${new Date(v+'-01T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'})}</option>`).join('');
 monthSelect.value=monthValues.includes(month)?month:'';
 const companySelect=$('companyFilter');
 const companyValues=[...new Set(projects.map(p=>p.company).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
 companySelect.innerHTML='<option value="">All Companies</option>'+companyValues.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
 companySelect.value=companyValues.includes(company)?company:'';
 const filtered=projects.filter(p=>(!monthSelect.value||(p.departure||'').startsWith(monthSelect.value))&&(!companySelect.value||p.company===companySelect.value)&&p.project.toLowerCase().includes(q)&&(!po||(po==='uploaded'?!!p.files?.po?.length:!p.files?.po?.length)));
 $('total').textContent=filtered.length;
 $('complete').textContent=filtered.filter(complete).length;
 $('pending').textContent=filtered.filter(p=>!complete(p)).length;
 $('empty').style.display=filtered.length?'none':'block';
 $('empty').textContent=projects.length?'No matching projects found for the selected month or search.':'No projects yet. Add a project in Project Register.';
 $('projectRows').innerHTML=filtered.map(p=>`<tr><td class="project">${esc(p.project)}</td><td>${esc(p.company||"—")}</td><td class="travel-dates"><div>${fullTravelDate(p.departure)}</div><div class="travel-return">${fullTravelDate(p.returnDate)}</div></td>${DOCS.map(d=>{const sections=d.key==='po'?[{key:'po',name:'PO'}]:SECTIONS.map(section=>({key:subKey(d.key,section.key),name:section.name}));const count=sections.reduce((n,section)=>n+(p.files?.[section.key]||[]).length,0);const ready=sections.every(section=>(p.files?.[section.key]||[]).length>0);return `<td class="doccell">${d.key==='po'?`<span class="pill ${ready?'ok':'wait'}">${ready?'✓ Uploaded':'N/A'}</span>${filePicker(p,'po')}`:`<div class="doc-sections">${sections.map(section=>`<div class="doc-section"><div class="doc-section-title">${esc(section.name)}${(p.files?.[section.key]||[]).length?' <span class="doc-check">✓</span>':''}</div>${(p.files?.[section.key]||[]).length?'':'<div class="doc-section-state">N/A</div>'}${filePicker(p,section.key)}</div>`).join('')}</div>`}</td>`}).join('')}<td class="actions"><button data-edit="${esc(p.id)}" title="Edit project and upload documents">✎ Edit</button><button data-delete="${esc(p.id)}">Delete</button></td></tr>`).join('');
}
const removed=new Map();
const stagedFiles=new Map();
const fileKey=(id,key,index)=>id+':'+key+(index===0?'':':'+index);
function uploadSlot(p,key,label,hint){const existing=p?.files?.[key]||[];return `<div class="uploadslot"><label for="file-${key}" class="slotlabel">${esc(label)}</label><div class="slotnote">${esc(hint)} · Multiple files allowed</div><input type="file" id="file-${key}" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.xls,.xlsx,.eml,.msg"><div class="fileinfo" id="info-${key}"><div class="filelist">${existing.map((f,i)=>`<div class="fileentry"><span>✓ ${esc(f.name)}</span><span><button type="button" data-open="${key}" data-index="${i}">View</button><button type="button" data-remove="${key}" data-index="${i}">Remove</button></span></div>`).join('')||'<span style="color:var(--muted)">N/A · No file uploaded</span>'}</div></div></div>`}
function filesHtml(p,d){const slots=d.key==='po'?uploadSlot(p,d.key,'PO','Upload Document'):SECTIONS.map(section=>uploadSlot(p,subKey(d.key,section.key),section.name,'Upload '+section.name)).join('');return `<div class="upload"><div class="uploadtop"><span class="ico">${icon(d.icon)}</span><div><strong>${d.name}</strong><small>${d.key==='po'?'Multiple files allowed':'Email Request · Reference'}</small></div></div><div class="uploadslots">${slots}</div></div>`}
function newProject(id=null){removed.clear();stagedFiles.clear();editing=id;const p=projects.find(x=>x.id===id);$('projectForm').reset();$('project').value=p?.project||'';$('company').value=p?.company||'';$('departure').value=p?.departure||'';$('returnDate').value=p?.returnDate||'';$('formTitle').textContent=p?'Edit Project':'New Project';$('uploads').innerHTML=DOCS.map(d=>filesHtml(p,d)).join('');show('register')}
async function openFile(id,key,index,meta){
 if(!meta?.id)return alert('Document reference is missing.');
 const preview=/^(application\/pdf|image\/)/.test(meta.type||'')||/\.(pdf|png|jpe?g|webp)$/i.test(meta.name||'');
 const tab=preview?window.open('','_blank'):null;
 try{
  const response=await fetch(API_BASE+'/files/'+encodeURIComponent(meta.id),{});
  if(!response.ok)throw Error('Unable to retrieve file ('+response.status+')');
  const blob=await response.blob(),url=URL.createObjectURL(blob);
  if(preview&&tab){tab.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),120000)}
  else{if(tab)tab.close();const a=document.createElement('a');a.href=url;a.download=meta.name||'document';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
 }catch(err){if(tab)tab.close();alert('Unable to open document: '+err.message)}
}
$('projectForm').addEventListener('submit',async e=>{
 e.preventDefault();const name=$('project').value.trim(),company=$('company').value,departure=$('departure').value,returnDate=$('returnDate').value;
 if(!name||!company||!departure||!returnDate)return alert('Please complete Project, Company and travel dates.');
 if(returnDate<departure)return alert('Return Date cannot be before Departure Date.');
 $('save').disabled=true;let id=editing;
 try{
  const payload={project:name,company,departure,return_date:returnDate};
  if(id)await api('/projects/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(payload)});
  else{const created=await api('/projects',{method:'POST',body:JSON.stringify(payload)});id=created.project?.id;if(!id)throw Error('Project was created but no ID was returned. Refresh the dashboard.');}
  const old=projects.find(p=>p.id===editing);
  for(const key of allKeys()){
   const existing=old?.files?.[key]||[],toRemove=removed.get(key)||new Set();
   for(const i of toRemove){const f=existing[i];if(f?.id)await api('/files/'+encodeURIComponent(f.id),{method:'DELETE'});}
   for(const f of (stagedFiles.get(key)||[])){
    if(!f.size||f.size>15*1024*1024)throw Error(key+': maximum file size is 15 MB per file.');
    const form=new FormData();form.append('document_key',key);form.append('file',f,f.name);
    await api('/projects/'+encodeURIComponent(id)+'/files',{method:'POST',body:form});
   }
  }
  removed.clear();stagedFiles.clear();await refreshProjects();show('dashboard');
 }catch(err){alert('Unable to save: '+err.message+'\nAny successful changes are already stored. Please refresh before retrying.');try{await refreshProjects()}catch{}}
 finally{$('save').disabled=false}
});
$('uploads').addEventListener('click',e=>{const rm=e.target.closest('[data-remove]'),op=e.target.closest('[data-open]');if(rm){const key=rm.dataset.remove,index=Number(rm.dataset.index);if(!removed.has(key))removed.set(key,new Set());removed.get(key).add(index);rm.closest('.fileentry').remove();}if(op){const p=projects.find(x=>x.id===editing),key=op.dataset.open,index=Number(op.dataset.index);if(p)openFile(p.id,key,index,p.files?.[key]?.[index])}});
$('uploads').addEventListener('change',e=>{if(e.target.type==='file'){const key=e.target.id.replace('file-',''),fs=[...(stagedFiles.get(key)||[]),...e.target.files];stagedFiles.set(key,fs);const list=$('info-'+key).querySelector('.filelist');const pending=list.querySelector('span[style]');if(pending)pending.remove();list.querySelectorAll('.ready').forEach(n=>n.remove());for(const f of fs){const div=document.createElement('div');div.className='fileentry ready';div.textContent='✓ '+f.name+' (ready to save)';list.appendChild(div)}}});
$('projectRows').addEventListener('click',async e=>{
 const toggle=e.target.closest('[data-file-toggle]');
 if(toggle){const menu=toggle.nextElementSibling,wasOpen=!menu.hidden;document.querySelectorAll('#projectRows .file-menu').forEach(m=>m.hidden=true);document.querySelectorAll('#projectRows [data-file-toggle]').forEach(b=>b.setAttribute('aria-expanded','false'));menu.hidden=wasOpen;toggle.setAttribute('aria-expanded',String(!wasOpen));return}
 const view=e.target.closest('[data-view-doc]'),edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');
 if(view){view.closest('.file-menu').hidden=true;const p=projects.find(x=>x.id===view.dataset.viewProject),key=view.dataset.viewDoc,index=Number(view.dataset.viewIndex);if(p)await openFile(p.id,key,index,p.files?.[key]?.[index]);return}
 if(edit){newProject(edit.dataset.edit)}
 if(del){const p=projects.find(x=>x.id===del.dataset.delete);if(!p||!confirm('Delete project “'+p.project+'” and all its files from the shared database?'))return;try{await api('/projects/'+encodeURIComponent(p.id),{method:'DELETE'});await refreshProjects()}catch(err){alert('Unable to delete project: '+err.message)}}
});
document.addEventListener('click',e=>{if(!e.target.closest('.file-picker'))document.querySelectorAll('#projectRows .file-menu').forEach(m=>m.hidden=true)});$('addTop').onclick=()=>{removed.clear();newProject()};$('navRegister').onclick=()=>{removed.clear();newProject()};$('navDash').onclick=()=>{removed.clear();stagedFiles.clear();show('dashboard')};$('search').oninput=render;$('monthFilter').onchange=render;$('companyFilter').onchange=render;$('poFilter').onchange=render;
for(const el of document.querySelectorAll('.dochead'))el.insertAdjacentHTML('afterbegin',icon(el.dataset.icon));
(async()=>{
 try{await refreshProjects();newProject()}
 catch(e){newProject();const msg=document.createElement('div');msg.className='notice';msg.style.margin='15px auto';msg.style.maxWidth='920px';msg.textContent='Shared database connection failed: '+e.message;document.querySelector('#register .formwrap').prepend(msg);}
})();
</script></body></html>
